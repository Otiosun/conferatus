name: Verify CONFERATUS
on:
  push:
    branches: [preview/v0.9.9-cinstia]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Diagnose build failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run build > build-diagnostics.log 2>&1
          code=$?
          set -e
          cat build-diagnostics.log
          if [ "$code" -ne 0 ]; then
            line=$(grep -E 'error TS[0-9]+|not ok |SyntaxError|Error:' build-diagnostics.log | head -1 | cut -c1-130 || true)
            if [ -z "$line" ]; then line=$(tail -n 1 build-diagnostics.log | cut -c1-130); fi
            jq -n --arg d "$line" '{state:"failure",context:"CONFERATUS build diagnostic",description:$d}' > status.json
            curl --fail --silent --show-error --retry 2 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data @status.json \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
            exit "$code"
          fi
