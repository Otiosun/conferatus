name: Preview voting checks
on:
  push:
    branches:
      - preview/v0.10.60-six-vote-forms
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # This service is created per run and destroyed afterwards. Never production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: conffratus_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d conffratus_lab"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci-disposable-only
      PGDATABASE: conffratus_lab
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client (CI only)
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Initialize isolated lab schema
        run: psql -X -v ON_ERROR_STOP=1 -f experimental/postgres/001_vote_lab.sql
      - name: Six methods, permissions, idempotency and audit tests
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/voting_lab.sql
      - name: Adversarial JSON, numerical overflow and option-integrity rejection
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/adversarial.sql
      - name: Concurrent inserts, role denial and transaction integrity
        run: bash tests/postgres/concurrency.sh
      - name: Audit fault injection and full rollback check
        run: psql -X -v ON_ERROR_STOP=1 -f tests/postgres/atomicity.sql
      - name: "Closure versus new vote - transaction serialization"
        run: bash tests/postgres/close-race.sh
  validate:
    needs: postgres-lab
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript build and Node tests
        run: npm run build
      - name: Install Chromium + Playwright for preview regressions
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          BROWSER=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          sudo ln -sf "$BROWSER" /usr/bin/chromium
      - name: Browser smoke and six-mode voting
        run: |
          sudo mkdir -p /mnt/data
          sudo chmod 777 /mnt/data
          failed=0
          for script in \
            tests/browser_smoke.py \
            tests/browser_calendar_return_v0120.py \
            tests/browser_calendar_cancel_confirmation_v0177.py \
            tests/browser_review_sheet_portrait_v0178.py \
            tests/browser_schedule_unsaved_guard_v0179.py \
            tests/browser_profile_schedule_context_v0180.py \
            tests/browser_profile_schedule_sheet_d2_v0181.py \
            tests/browser_schedule_choices_method_roundtrip_v0182.py \
            tests/browser_review_unsaved_selection_v0183.py \
            tests/browser_review_d3_single_modal_v0184.py \
            tests/browser_stage7_interactive_text_zoom_v0185.py \
            tests/browser_stage7_short_viewport_v0187.py \
            tests/browser_stage7_focus_not_obscured_v0188.py \
            tests/browser_voting_normal_flow_v0190.py \
            tests/browser_demoted_history_v0191.py \
            tests/browser_voting_section_links_v0192.py \
            tests/browser_vote_profile_links_v0193.py \
            tests/browser_vote_states_v0194.py \
            tests/browser_cancelled_vote_context_v0201.py \
            tests/browser_product_vote_isolation_v0202.py \
            tests/browser_schedule_return_v0203.py \
            tests/browser_stage04_normal_socii_v0195.py \
            tests/browser_stage04_complete_v0196.py \
            tests/browser_history_isolation_v0197.py \
            tests/browser_stage7_integrated_v0198.py \
            tests/browser_stage7_dynamic_focus_v0200.py \
            tests/browser_stage7_advanced_controls_v0132.py \
            tests/browser_restored_links_integrity_v0157.py \
            tests/browser_local_archive_v0158.py \
            tests/browser_profile_proposals_v013.py \
            tests/browser_local_author_schedule_links_v0151.py \
            tests/browser_socii_explicit_choice_v0122.py \
            tests/browser_review_metadata_integrity_v0119.py \
            tests/browser_workflow_save_failures_v0155.py \
            tests/browser_stage7_keyboard_focus_v0139.py \
            tests/browser_stage7_zoom_reflow_v0135.py \
            tests/browser_stage7_long_draft_v0133.py \
            tests/browser_rich_editor_v0163.py \
            tests/browser_rich_typography_v0164.py \
            tests/browser_rich_layout_v0165.py \
            tests/browser_rich_indices_v0166.py \
            tests/browser_rich_links_v0167.py \
            tests/browser_block_native_probe_v0168.py \
            tests/browser_block_deletion_guard_v0169.py \
            tests/browser_block_graphemes_v0170.py \
            tests/browser_block_recovery_v0171.py \
            tests/browser_compose_exit_guard_v0172.py \
            tests/browser_full_workflow_journey_v0173.py \
            tests/browser_unsaved_unload_v0174.py \
            tests/browser_mobile_readability_v0175.py \
            tests/browser_socii_multiple_drafts_v0176.py \
            tests/browser_calendar_v012.py \
            tests/browser_drafts_v011.py \
            tests/browser_socii_progress_v014.py \
            tests/browser_signature_integrity_v0113.py \
            tests/browser_restore_integrity_v0114.py \
            tests/browser_session_recovery_v0115.py \
            tests/browser_unique_records_v0116.py \
            tests/browser_workflow_id_collision_v0152.py \
            tests/browser_cancelled_schedule_history_v0153.py \
            tests/browser_cancelled_save_recovery_v0154.py \
            tests/browser_restored_proposal_integrity_v0156.py \
            tests/browser_navigation_v014.py \
            tests/browser_footer_drawer_v0162.py \
            tests/browser_stage7_form_edge_targets_v0131.py \
            tests/browser_preview_disclosure_v0117.py \
            tests/browser_stage7_dynamic_aria_v0141.py \
            tests/browser_stage7_live_announcer_v0144.py \
            tests/browser_stage7_error_fields_v0141.py; do
            echo "Checking $script"
            python "$script" || failed=1
          done
          exit "$failed"
      # These screenshots are generated by existing synthetic-data browser tests.
      # No image-generation step or new dependency is introduced.
      - name: Upload reproducible browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CONFFRATUS-preview-visual-evidence
          path: dist/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload offline preview for QA (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CONFFRATUS-v0.10.60-preview
          path: dist/CONFFRATUS_demo_offline.html
          retention-days: 7


  cross-browser-lab:
    # Explicitly opt in; do not slow down every documentation checkpoint.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[cross-browser]') }}
    # Independent build: cross-engine QA still runs when an unrelated
    # Chromium assertion fails; it never bypasses the required validate gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build this exact preview commit
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Install disposable Firefox and WebKit
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps firefox webkit
      - name: Exercise Firefox and WebKit with fictional data
        run: |
          for engine in firefox webkit; do
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_cross_engine_smoke_v0160.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_rich_typography_v0164.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_rich_layout_v0165.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_rich_indices_v0166.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_rich_links_v0167.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_block_native_probe_v0168.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_block_deletion_guard_v0169.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_block_graphemes_v0170.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_block_recovery_v0171.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_full_workflow_journey_v0173.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_unsaved_unload_v0174.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_mobile_readability_v0175.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_socii_multiple_drafts_v0176.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_calendar_cancel_confirmation_v0177.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_review_sheet_portrait_v0178.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_schedule_unsaved_guard_v0179.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_profile_schedule_context_v0180.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_profile_schedule_sheet_d2_v0181.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_schedule_choices_method_roundtrip_v0182.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_review_unsaved_selection_v0183.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_review_d3_single_modal_v0184.py
            CONFFRATUS_TEST_ENGINE="$engine" python tests/browser_stage7_interactive_text_zoom_v0185.py
          done
      - name: Upload optional multi-engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CONFFRATUS-cross-browser-evidence
          path: dist/cross_engine_*
          if-no-files-found: ignore
          retention-days: 7
