name: Preview voting checks
on:
  push:
    branches:
      - preview/v0.10.60-six-vote-forms
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript build and Node tests
        run: npm run build
      - name: Install Chromium + Playwright for preview regressions
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          BROWSER=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          sudo ln -sf "$BROWSER" /usr/bin/chromium
      - name: Browser smoke and six-mode voting
        run: |
          python tests/browser_smoke.py
          python tests/browser_calendar_return_v0120.py
          python tests/browser_stage7_advanced_controls_v0132.py
          python tests/browser_restored_links_integrity_v0157.py
          python tests/browser_local_archive_v0158.py
